[package]
name = "tinysecurity-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["native-storage"]
# Driver-backed native secret storage is retained for current default users.
native-storage = ["dep:tinystoragedrivers"]
# Linux Secret Service is an explicit opt-in; it never changes the default.
keyring-secret-service = ["native-storage", "tinystoragedrivers/keyring-secret-service"]
# Wire-compatible device pairing and tunnel crypto without storage drivers.
device-pairing = []

[dependencies]
# Reuse owner secret ports and encryption instead of copying implementations.
tinystoragedrivers = { workspace = true, optional = true }
# Transport-free device operation vocabulary and exact binding digest.
tinysecurity-bus.workspace = true
# Consume move-only native Human Once App I/O authority inside the owner.
tinysecurity-approval.workspace = true
sha2.workspace = true
serde_json.workspace = true
aws-lc-rs.workspace = true
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
chacha20.workspace = true
poly1305.workspace = true
base64.workspace = true
aes-gcm.workspace = true
# Explicit feature unification: upstream AES-GCM does not forward cleanup.
aes.workspace = true
ghash.workspace = true
polyval.workspace = true
argon2.workspace = true
zeroize.workspace = true
getrandom.workspace = true
thiserror.workspace = true
serde.workspace = true

[dev-dependencies]
# Real approval engine integration fixtures require its configured redactor.
tinysecurity-redact.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# App-store fixtures need protected private ACLs at directory and file creation.
clack-private-fs = "1"

[lints]
workspace = true
